name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ARM64 is the row that earns this matrix. x86-64 against ARM64 is exactly where IEEE 754
        # arithmetic diverges in practice, and being integer-only is the entire reason the
        # simulation can promise it does not. Two x86 platforms agreeing proves the build is
        # reproducible; it does not test the claim.
        #
        # The Phase 0 gate checked it by hand on an Android phone and nothing has checked it since,
        # so every commit between then and now was unverified on the one boundary that matters. A
        # native ARM64 runner puts it back on every push.
        #
        # ARM64 Linux rather than Android, and the difference is worth knowing. This tests the
        # simulation's arithmetic, which is what the determinism matrix is for: MoleSim is plain
        # netstandard2.1 with no engine dependency, so the CPU is the whole of what varies. It does
        # not test Godot's Android export or the Mono runtime that ships with it. That is a client
        # packaging question, it needs a device or an emulator, and tools/scripts/deploy-android.sh
        # is how it gets asked.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The clip pipeline's video encoder shells out to ffmpeg, and ffmpeg is the only thing that
      # knows whether the command line it is handed is right: a wrong pixel format gives coloured
      # noise and a wrong frame size gives a picture that shears, both without an error. Those tests
      # skip themselves where there is no binary, and they were skipping here, which made a suite
      # that looked green a suite that had never run the encoder at all. One package buys the only
      # honest check there is.
      - name: Install ffmpeg for the clip encoder
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Record determinism fingerprint
        shell: bash
        run: |
          dotnet run --project tools/Molehill.Cli --configuration Release --no-build -- selftest \
            | tee full-fingerprint.txt
          # Keep only the lines that must match across platforms. The runtime and OS
          # lines are deliberately excluded: they are meant to differ.
          grep -E '^(fix64|vec2|rng|terrain)' full-fingerprint.txt > fingerprint.txt
          cat fingerprint.txt

      # A fingerprint says whether two machines agree. When they do not, the next question is
      # always "where", and a round is atomic from the outside, so without this the answer was a
      # whole match. The trace is a hash and every mole's raw numbers per tick, about 1.2 MB, kept
      # from every run so that a disagreement can be bisected from the artifacts of the build that
      # found it rather than by trying to reproduce it afterwards.
      - name: Record a per-tick trace
        shell: bash
        run: |
          dotnet run --project tools/Molehill.Cli --configuration Release --no-build -- \
            trace --out=trace.tsv

      - name: Upload fingerprint and trace
        uses: actions/upload-artifact@v7
        with:
          name: fingerprint-${{ matrix.os }}
          path: |
            fingerprint.txt
            trace.tsv
          if-no-files-found: error

  determinism:
    name: Platforms agree
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download fingerprints and traces
        uses: actions/download-artifact@v8
        with:
          pattern: fingerprint-*
          path: fingerprints

      - name: Compare across platforms
        run: |
          echo "Fingerprints collected:"
          find fingerprints -name fingerprint.txt | sort
          echo

          first=""
          for file in $(find fingerprints -name fingerprint.txt | sort); do
            echo "--- $file"
            cat "$file"
            echo
            if [ -z "$first" ]; then
              first="$file"
            elif ! diff -u "$first" "$file"; then
              echo
              echo "::error::Simulation results differ between platforms. Online play is"
              echo "::error::impossible until this is fixed. Bisect the first differing tick"
              echo "::error::before doing anything else:"
              echo "::error::  molehill trace  --out=a.tsv   (on each platform)"
              echo "::error::  molehill bisect a.tsv b.tsv"
              exit 1
            fi
          done

          echo "All platforms computed identical results."

      # Belt and braces, and they check different things. The fingerprint above is a handful of
      # probes over the arithmetic, the generator and the terrain hash; this is a whole four-player
      # match compared tick by tick. A run that passes the first and fails this one has a divergence
      # in the rules rather than in the primitives, which is the harder half and the half that used
      # to be invisible.
      - name: Bisect the traces against each other
        run: |
          dotnet build tools/Molehill.Cli --configuration Release

          first=""
          status=0

          for file in $(find fingerprints -name trace.tsv | sort); do
            if [ -z "$first" ]; then
              first="$file"
              echo "Reference trace: $first"
              continue
            fi

            echo
            echo "=== $first  against  $file"

            if ! dotnet run --project tools/Molehill.Cli --configuration Release --no-build -- \
                   bisect "$first" "$file"; then
              status=1
            fi
          done

          if [ "$status" -ne 0 ]; then
            echo
            echo "::error::The simulation diverges between platforms. The tick and the field are"
            echo "::error::named above. Online play is impossible until this is fixed."
            exit 1
          fi

          echo
          echo "Every platform computed the same match, tick by tick."

  guards:
    name: Simulation guards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Stands in for a Roslyn analyzer until one is worth writing. The simulation must
      # never contain IEEE 754 arithmetic, an unseeded generator, or a clock: each of
      # them can produce a different answer on a different machine, which would silently
      # fork a live match between a phone and a PC.
      - name: No banned APIs in MoleSim
        run: |
          if grep -rnE '\b(float|double|System\.Random|DateTime|DateTimeOffset|Environment\.TickCount)\b' \
               sim/MoleSim --include='*.cs'; then
            echo
            echo "::error::Banned API in MoleSim. The simulation must stay integer-only and"
            echo "::error::free of clocks and unseeded randomness. Use Fix64 and MatchRng."
            exit 1
          fi
          echo "MoleSim is clean."

      # MoleSim is the game; nothing may pull it toward an engine or the outside world.
      - name: MoleSim has no dependencies
        run: |
          if grep -nE '<(PackageReference|ProjectReference|FrameworkReference)' \
               sim/MoleSim/MoleSim.csproj; then
            echo
            echo "::error::MoleSim must reference nothing. Move the dependency into a consumer."
            exit 1
          fi
          echo "MoleSim references nothing."
